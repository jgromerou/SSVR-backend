services:

  mysql:
    image: mysql:8.4
    container_name: ssvr_mysql
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    env_file:
      - .env.mysql

    environment:
      MYSQL_DATABASE: ssvr

      # MUY IMPORTANTE:
      # evita root@'%' y mantiene root solamente local.
      MYSQL_ROOT_HOST: localhost

    security_opt:
      - no-new-privileges:true

    ports:
      - "192.168.5.30:3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./ssvr.sql:/docker-entrypoint-initdb.d/ssvr.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
        ]

      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - db_network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ssvr_backend
    restart: unless-stopped

    env_file:
      - .env.production

    security_opt:
      - no-new-privileges:true

    depends_on:
      mysql:
        condition: service_healthy

    expose:
      - "3000"

    networks:
      - web_network
      - db_network


  nginx:
    image: nginx:alpine
    container_name: ssvr_nginx
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "80:80"

    volumes:
      - ../SSVR-frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    networks:
      - web_network


networks:

  web_network:
    driver: bridge

  db_network:
    driver: bridge
    #internal: true - Red estaba diseñada precisamente para que MySQL fuese inaccesible desde fuera de Docker.


volumes:

  mysql_data:
    name: ssvr_mysql_data