# Instalación nativa (sin Docker): Nginx del sistema + backend con PM2 en 127.0.0.1:3000.
# Copiar a /etc/nginx/sites-available/ssvr.conf y enlazar en sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/ssvr.conf /etc/nginx/sites-enabled/ssvr.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    #server_name tu-dominio.com;

    root /var/www/ssvr-frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Para HTTPS con Certbot (recomendado en producción):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com
# Certbot reescribe este archivo agregando el bloque listen 443 ssl y la redirección 80->443.
